---
name: Release

on:
  workflow_run:
    workflows: ["Build and test"]
    branches: [main]
    types:
      - completed

permissions:
  contents: write

jobs:
  # The tag is bumped on Linux because anothrNick/github-tag-action is a Docker
  # container action and Docker actions only run on Linux runners.
  tag:
    runs-on: ubuntu-24.04
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WITH_V: true
          DEFAULT_BUMP: patch
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  # The 1Password SDK's desktop app integration requires CGO. We release from a
  # single macOS runner: darwin builds natively with clang, and linux/amd64
  # cross-compiles with zig as the C compiler (see .goreleaser.yml). This keeps
  # everything in one GoReleaser invocation (changelog, checksums, one release).
  release:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          ref: ${{ needs.tag.outputs.new_tag }}
      - name: Set up Go
        uses: arnested/setup-go@rc
        with:
          go-version-file: go.mod
      - run: go version
      - name: Set up Zig
        uses: ./.github/actions/setup-zig
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
